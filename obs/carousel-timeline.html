<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel Timeline - OBS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: transparent;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #eaeaea;
      }
      .wrap {
        padding: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }

      .carousel-card {
        width: 480px;
        max-width: calc(100vw - 40px);
        background: rgba(0, 0, 0, 0.85);
        border-radius: 12px;
        border: 2px solid rgba(102, 126, 234, 0.45);
        padding: 18px 20px;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
        position: relative;
        overflow: hidden;
      }

      .wing-badge {
        position: absolute;
        right: 14px;
        top: 14px;
        background: rgba(102, 126, 234, 0.12);
        color: #667eea;
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 0.9rem;
        border: 1px solid rgba(102, 126, 234, 0.25);
      }

      .card-content {
        transition: opacity 280ms ease;
        opacity: 1;
      }
      .item-name {
        font-size: 1.15rem;
        font-weight: 700;
        color: #f5f5f5;
        margin-bottom: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-category {
        color: #9aa6ff;
        font-weight: 700;
        font-size: 0.85rem;
        margin-right: 10px;
      }
      .item-zone {
        color: #9ec7b7;
        font-weight: 600;
        font-size: 0.85rem;
      }
      .meta-row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }
      .timestamp {
        color: #bdbdbd;
        font-size: 0.82rem;
        font-style: italic;
      }
      .empty {
        text-align: center;
        padding: 36px 12px;
        color: #999;
      }
      .small-note {
        margin-top: 8px;
        text-align: center;
        color: #888;
        font-size: 0.78rem;
      }

      @keyframes initialFade {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .carousel-card {
        animation: initialFade 420ms ease;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="carousel-card" id="carouselCard">
        <div class="wing-badge" id="wingBadge">Wing 0</div>
        <div id="cardInner" class="card-content">
          <div class="item-name" id="itemName">Connecting...</div>
          <div class="meta-row">
            <div class="item-category" id="itemCategory">Category</div>
            <div class="item-zone" id="itemZone">Zone</div>
            <div style="flex: 1"></div>
            <div class="timestamp" id="itemTime">—</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const CONFIG = {
        apiUrl: "http://localhost:3000/api/obs/timeline",
        refreshInterval: 15000,
        carouselLimit: 500,
        carouselInterval: 5000,
        timeRefreshInterval: 30000,
        league: "Phrecia 2.0",
        trackedCategories: [
          "Jewellery",
          "T1 Replicas",
          "T0 Replicas",
          "Uniques",
        ],
      };

      // Parse URL parameters to override config
      const urlParams = new URLSearchParams(window.location.search);
      const leagueParam = urlParams.get("league");
      if (leagueParam) {
        CONFIG.league = leagueParam;
      }

      let items = [];
      let currentIndex = 0;
      let rotateTimer = null;

      const cardInner = document.getElementById("cardInner");
      const wingBadge = document.getElementById("wingBadge");
      const itemNameEl = document.getElementById("itemName");
      const itemCategoryEl = document.getElementById("itemCategory");
      const itemZoneEl = document.getElementById("itemZone");
      const itemTimeEl = document.getElementById("itemTime");

      async function fetchTimeline() {
        try {
          const params = new URLSearchParams();
          if (CONFIG.league) params.append("league", CONFIG.league);
          params.append("limit", CONFIG.carouselLimit);
          const url = `${CONFIG.apiUrl}?${params.toString()}`;
          const resp = await fetch(url);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();

          const newItems = (data.items || []).filter(
            (it) =>
              !CONFIG.trackedCategories.length ||
              CONFIG.trackedCategories.includes(it.category),
          );

          const prevId = items[currentIndex]
            ? `${items[currentIndex].heistId}-${items[currentIndex].itemName}-${items[currentIndex].timestamp}`
            : null;
          items = newItems;

          if (items.length === 0) {
            showEmpty();
            stopRotation();
            return;
          }

          if (prevId) {
            const idx = items.findIndex(
              (it) => `${it.heistId}-${it.itemName}-${it.timestamp}` === prevId,
            );
            currentIndex = idx >= 0 ? idx : 0;
          } else {
            currentIndex = 0;
          }

          showItem(currentIndex, false);
          startRotation();
        } catch (err) {
          console.error("Carousel fetch error", err);
          showEmpty("Connection error");
        }
      }

      function showEmpty(msg = "No tracked items") {
        wingBadge.textContent = "";
        itemNameEl.textContent = msg;
        itemCategoryEl.textContent = "";
        itemZoneEl.textContent = "";
        itemTimeEl.textContent = "";
      }

      function showItem(index, animate = true) {
        if (!items || items.length === 0) return showEmpty();
        const it = items[index % items.length];
        if (!it) return;

        const wingText = `Wing ${it.wingNumber ?? "-"}`;
        const nameText = it.itemName || "Unknown item";
        const categoryText = it.category || "-";
        const zoneText = it.zoneName || it.zone || "-";
        const timeText = getTimeAgo(it.timestamp);

        if (animate) cardInner.style.opacity = 0;
        setTimeout(
          () => {
            wingBadge.textContent = wingText;
            itemNameEl.textContent = nameText;
            itemCategoryEl.textContent = categoryText;
            itemZoneEl.textContent = zoneText;
            itemTimeEl.textContent = timeText;
            cardInner.dataset.timestamp = it.timestamp;
            if (animate) cardInner.style.opacity = 1;
          },
          animate ? 260 : 0,
        );
      }

      function advance() {
        if (!items || items.length <= 1) return;
        currentIndex = (currentIndex + 1) % items.length;
        showItem(currentIndex, true);
      }

      function startRotation() {
        if (rotateTimer) return;
        if (!items || items.length <= 1) return;
        rotateTimer = setInterval(advance, CONFIG.carouselInterval);
      }

      function stopRotation() {
        if (rotateTimer) {
          clearInterval(rotateTimer);
          rotateTimer = null;
        }
      }

      function refreshTimeLabels() {
        const ts = cardInner.dataset.timestamp;
        if (!ts) return;
        itemTimeEl.textContent = getTimeAgo(ts);
      }

      function getTimeAgo(timestamp) {
        const now = new Date();
        const then = new Date(timestamp);
        const diffMs = now - then;
        const diffMins = Math.floor(diffMs / 60000);
        if (diffMins < 1) return "Just now";
        if (diffMins === 1) return "1 min ago";
        if (diffMins < 60) return `${diffMins} mins ago`;
        const diffHours = Math.floor(diffMins / 60);
        if (diffHours === 1) return "1 hour ago";
        if (diffHours < 24) return `${diffHours} hours ago`;
        const diffDays = Math.floor(diffHours / 24);
        if (diffDays === 1) return "1 day ago";
        return `${diffDays} days ago`;
      }

      // startup
      fetchTimeline();
      setInterval(fetchTimeline, CONFIG.refreshInterval);
      setInterval(refreshTimeLabels, CONFIG.timeRefreshInterval);
      window.addEventListener("beforeunload", () => {
        stopRotation();
      });
      console.log("Carousel Timeline initialized", CONFIG);
    </script>
  </body>
</html>
