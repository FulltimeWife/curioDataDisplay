<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curio Display (OBS)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: white;
        overflow: hidden;
      }
      .container {
        padding: 10px;
      }
      .stats-panel {
        background: rgba(0, 0, 0, 0.85);
        border-radius: 8px;
        padding: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        border: 2px solid rgba(102, 126, 234, 0.5);
        min-width: 300px;
      }
      .panel-title {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: #667eea;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        padding-bottom: 6px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .stat-row:last-child {
        border-bottom: none;
      }
      .stat-label {
        font-size: 0.95rem;
        font-weight: 500;
        color: #e0e0e0;
      }
      .stat-value {
        font-size: 1.1rem;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.8));
      }
      .categories-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 2px solid rgba(102, 126, 234, 0.3);
      }
      .item-section {
        display: flex;
        flex-direction: column;
      }
      .item-section-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 6px;
        color: #667eea;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .items-container {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .item-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 6px 8px;
        background: rgba(102, 126, 234, 0.1);
        border-radius: 6px;
        border: 1px solid rgba(102, 126, 234, 0.3);
        transition: all 0.2s ease;
        min-width: fit-content;
      }
      .item-chip:hover {
        background: rgba(102, 126, 234, 0.15);
        border-color: rgba(102, 126, 234, 0.5);
      }
      .item-name {
        font-size: 1rem;
        color: #d0d0d0;
        font-weight: 500;
        margin-bottom: 3px;
        text-align: center;
      }
      .item-count {
        font-size: 1rem;
        font-weight: 700;
        color: #4caf50;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        margin-left: 0;
        white-space: nowrap;
      }
      .item-count.zero {
        color: #e74c3c;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: #667eea;
        font-size: 1.2rem;
      }
      .error {
        text-align: center;
        padding: 40px;
        color: #e74c3c;
        font-size: 1.2rem;
      }
      .last-update {
        margin-top: 8px;
        text-align: center;
        font-size: 0.75rem;
        color: #888;
        font-style: italic;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
      .stats-panel {
        animation: fadeIn 0.5s ease;
      }
      .stat-value.updated {
        animation: pulse 0.5s ease;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="content"><div class="loading">Loading stats</div></div>
    </div>
    <script>
      const CONFIG = {
        apiUrl: "http://localhost:3000/api/obs/stats",
        refreshInterval: 30000,
        league: "Phrecia 2.0",
        trackedItems: {
          Jewellery: [
            "Cogwork Ring",
            "Geodesic Ring",
            "Helical Ring",
            "Manifold Ring",
            "Astrolabe Amulet",
            "Focused Amulet",
            "Simplex Amulet",
          ],
          "T1 Replicas": [
            "Replica Atziri's Acuity",
            "Replica Badge of the Brotherhood",
            "Replica Covenant",
            "Replica Eternity Shroud",
            "Replica Farrul's Fur",
            "Replica Hyrri's Ire",
            "Replica Maloney's Mechanism",
            "Replica Nebulis",
            "Replica Poorjoy's Asylum",
            "Replica Trypanon",
            "Replica Windripper",
          ],
          "T0 Replicas": [
            "Replica Bated Breath",
            "Replica Duskdawn",
            "Replica Headhunter",
            "Replica Kongor's Undying Rage",
            "Replica Shroud of the Lightless",
            "Replica Tukohama's Fortress",
          ],
          Uniques: ["Crest of Desire", "Expedition's End", "The Fulcrum"],
        },
        panelTitle: "Heist Stats",
      };
      let currentData = null,
        previousData = null;

      async function fetchStats() {
        try {
          const params = new URLSearchParams();
          if (CONFIG.league) params.append("league", CONFIG.league);
          const allItems = Object.values(CONFIG.trackedItems).flat();
          if (allItems.length > 0) params.append("items", allItems.join(","));
          const url = `${CONFIG.apiUrl}?${params.toString()}`;
          const response = await fetch(url);
          if (!response.ok)
            throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.json();
          console.log(data);
          updateDisplay(data);
        } catch (error) {
          console.error("Error fetching stats:", error);
          showError("Failed to fetch stats. Is the server running?");
        }
      }

      function updateDisplay(data) {
        previousData = currentData;
        currentData = data;
        const content = document.getElementById("content");
        let html = `<div class="stats-panel"><div class="panel-title">${CONFIG.panelTitle}</div>
        <div class="stat-row"><div class="stat-label">Wings Ran</div><div class="stat-value ${hasChanged("wingsRan") ? "updated" : ""}">${data.wingsRan.toLocaleString()}</div></div>
        <div class="stat-row"><div class="stat-label">Items Seen</div><div class="stat-value ${hasChanged("itemsSeen") ? "updated" : ""}">${data.itemsSeen.toLocaleString()}</div></div>`;
        if (Object.keys(data.itemCounts).length > 0) {
          html += `<div class="categories-container">`;
          Object.entries(CONFIG.trackedItems).forEach(([category, items]) => {
            html += `<div class="item-section"><div class="item-section-title">${category}</div><div class="items-container">`;
            items.forEach((itemName) => {
              const count = data.itemCounts[itemName] || 0;
              const changed = hasChangedItem(itemName);
              html += `<div class="item-chip"><div class="item-name">${itemName}</div><div class="item-count ${count === 0 ? "zero" : ""} ${changed ? "updated" : ""}">${count}</div></div>`;
            });
            html += `</div></div>`;
          });
          html += `</div>`;
        }
        const updateTime = new Date(data.timestamp).toLocaleTimeString();
        html += `<div class="last-update">Last update: ${updateTime}</div></div>`;
        content.innerHTML = html;
      }
      function showError(message) {
        document.getElementById("content").innerHTML =
          `<div class="error">${message}</div>`;
      }
      function hasChanged(field) {
        if (!previousData || !currentData) return false;
        return previousData[field] !== currentData[field];
      }
      function hasChangedItem(itemName) {
        if (!previousData || !currentData) return false;
        const prevCount = previousData.itemCounts[itemName] || 0;
        const currCount = currentData.itemCounts[itemName] || 0;
        return prevCount !== currCount;
      }
      fetchStats();
      setInterval(fetchStats, CONFIG.refreshInterval);
      console.log("OBS Overlay Configuration:", CONFIG);
    </script>
  </body>
</html>
